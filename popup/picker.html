<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollux Palette — Wallpaper Extractor</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #141214;
      padding: 20px;
    }
    .picker-container {
      width: 440px;
      max-width: 90vw;
      background: #1F1B1E;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
    }
    .drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.03);
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #F8DCED;
      background: rgba(255, 255, 255, 0.08);
    }
    .drop-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      color: var(--p-primary, #F8DCED);
    }
    .preview-box {
      display: none;
      flex-direction: column;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 14px;
    }
    .preview-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
    }
    .apply-btn {
      background: #F8DCED;
      color: #340B29;
      font-weight: 600;
      font-size: 14px;
      border: none;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .apply-btn:hover {
      background: #FFFFFF;
      transform: translateY(-1px);
    }
    .status-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      text-align: center;
      color: #7BDCA2;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="picker-container">
    <div class="header">
      <img src="../icons/icon-48.png" alt="Logo" class="logo">
      <div class="title-group">
        <h1 class="title">Wallpaper Monet Extractor</h1>
        <span class="subtitle">Extract Material You colors from any image</span>
      </div>
    </div>

    <label class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
      <div class="drop-icon" aria-hidden="true">
        <svg class="m3-icon m3-icon-xl" viewBox="0 -960 960 960">
          <path d="M480-480ZM180-120q-24 0-42-18t-18-42v-600q0-24 18-42t42-18h335q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5H180v600h600v-335q0-12.75 8.68-21.38 8.67-8.62 21.5-8.62 12.82 0 21.32 8.62 8.5 8.63 8.5 21.38v335q0 24-18 42t-42 18H180Zm60-162h480L576-474 449-307l-94-124-115 149Zm453-410h-58q-12.75 0-21.37-8.68-8.63-8.67-8.63-21.5 0-12.82 8.63-21.32 8.62-8.5 21.37-8.5h58v-58q0-12.75 8.68-21.38 8.67-8.62 21.5-8.62 12.82 0 21.32 8.62 8.5 8.63 8.5 21.38v58h57q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5h-57v57q0 12.75-8.68 21.37-8.67 8.63-21.5 8.63-12.82 0-21.32-8.63-8.5-8.62-8.5-21.37v-57Z"/>
        </svg>
      </div>
      <div style="font-weight: 600; font-size: 14px; color: #EDE0E4;">Click to browse or drag & drop wallpaper</div>
      <div style="font-size: 12px; color: #B2A3A9; margin-top: 4px;">PNG, JPG, WebP supported</div>
    </label>

    <div class="preview-box" id="previewBox">
      <img id="imagePreview" class="preview-img" alt="Wallpaper Preview">
      <div class="active-preview" style="background: rgba(255, 255, 255, 0.08);">
        <div class="color-dot" id="extractedDot"></div>
        <div class="preview-text">
          <span class="preview-label">Extracted Seed Color</span>
          <span class="preview-hex" id="extractedHex">#814F70</span>
        </div>
      </div>
      <button class="apply-btn" id="applyBtn">Apply to Gemini Web</button>
      <div class="status-msg" id="statusMsg" style="display: none;">
        <svg class="m3-icon m3-icon-sm" viewBox="0 -960 960 960" aria-hidden="true">
          <path d="m421-389-98-98q-9-9-22-9t-23 10q-9 9-9 22t9 22l122 123q9 9 21 9t21-9l239-239q10-10 10-23t-10-23q-10-9-23.5-8.5T635-603L421-389Zm59 309q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-156t86-127Q252-817 325-848.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 82-31.5 155T763-197.5q-54 54.5-127 86T480-80Zm0-60q142 0 241-99.5T820-480q0-142-99-241t-241-99q-141 0-240.5 99T140-480q0 141 99.5 240.5T480-140Zm0-340Z"/>
        </svg>
        <span>Applied to Gemini! You can close this tab.</span>
      </div>
    </div>
  </div>

  <script src="../material-color.js"></script>
  <script src="picker.js"></script>
</body>
</html>
